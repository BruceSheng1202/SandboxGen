name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/locks/dev.txt
      - run: python -m pip install --require-hashes -r requirements/locks/dev.txt
      - run: python -m pytest -q
      - run: python src/orchestrator.py --help
      - run: python tools/check_release.py
      - run: git diff --check
